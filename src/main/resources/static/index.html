<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicinas Naturales - Buscador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Modo Claro */
            --bg-body: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --container-bg: #ffffff;
            --header-gradient: linear-gradient(to right, #2E7D32, #4CAF50);
            --text-main: #333333;
            --text-muted: #666666;
            --card-bg: #ffffff;
            --card-header: linear-gradient(to right, #E8F5E9, #C8E6C9);
            --card-border: #e0e0e0;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            /* Modo Oscuro */
            --bg-body: #121212;
            --container-bg: #1e1e1e;
            --header-gradient: linear-gradient(to right, #1b5e20, #2e7d32);
            --text-main: #e0e0e0;
            --text-muted: #999999;
            --card-bg: #282828;
            --card-header: linear-gradient(to right, #253d26, #1b5e20);
            --card-border: #383838;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --input-bg: #2d2d2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-body);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-main);
            transition: all 0.4s ease;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--container-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        header {
            background: var(--header-gradient);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        /* --- Estilos del Switch y Leyenda --- */
        .theme-switch-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .theme-switch {
            display: inline-block;
            height: 24px;
            position: relative;
            width: 45px;
        }

        .theme-switch input { display: none; }

        .slider {
            background-color: rgba(255,255,255,0.3);
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            background-color: white;
            bottom: 3px;
            content: "";
            height: 18px;
            left: 4px;
            position: absolute;
            transition: .4s;
            width: 18px;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #81C784; }
        input:checked + .slider:before { transform: translateX(19px); }

        .icons-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-diamond {
            color: #b9f2ff;
            font-size: 0.9rem;
            filter: drop-shadow(0 0 5px rgba(185, 242, 255, 0.8));
            transition: all 0.3s ease;
        }

        .icon-moon {
            color: #f1c40f;
            font-size: 0.9rem;
            filter: drop-shadow(0 0 5px rgba(185, 242, 255, 0.8));
            transition: all 0.3s ease;
        }

        @keyframes shine {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(185, 242, 255, 1)); }
            100% { opacity: 0.8; transform: scale(1); }
        }

        .dark-side-text {
            font-style: italic;
            font-size: 0.65rem;
            margin-top: 5px;
            color: white;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { font-size: 1.1rem; opacity: 0.9; }

        /* --- Secciones --- */
        .search-section {
            padding: 30px;
            border-bottom: 1px solid var(--card-border);
        }

        .search-box {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        #searchInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #4CAF50;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            background: var(--input-bg);
            color: var(--text-main);
            transition: all 0.3s;
        }

        #searchButton {
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 0 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .results-section { padding: 30px; }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #resultsCount {
            background: rgba(76, 175, 80, 0.1);
            color: #4CAF50;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .medicines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .medicine-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px var(--shadow);
            transition: all 0.3s ease;
            border: 1px solid var(--card-border);
        }

        .medicine-header {
            background: var(--card-header);
            padding: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        .medicine-name { font-size: 1.4rem; color: #4CAF50; margin-bottom: 5px; }
        .medicine-body { padding: 20px; }
        .medicine-desc { color: var(--text-muted); line-height: 1.6; margin-bottom: 15px; }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .search-box { flex-direction: column; }
            header h1 { font-size: 1.8rem; }
            .theme-switch-wrapper { position: static; margin-bottom: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="theme-switch-wrapper">
            <div class="switch-container">
                <div class="icons-row">
                    <i class="fas fa-gem icon-diamond"></i>
                    <label class="theme-switch" for="checkbox">
                        <input type="checkbox" id="checkbox" />
                        <div class="slider"></div>
                    </label>
                    <i class="fas fa-moon icon-moon"></i>
                </div>
                <p class="dark-side-text" id="modeText">Shine On You Crazy Diamond</p>
            </div>
        </div>
        <h1><i class="fas fa-leaf"></i> Medicinas Naturales</h1>
        <p>"Que tu alimento sea tu medicina, y tu medicina tu alimento" -Hipócrates</p>
    </header>

    <section class="search-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Busca una medicina..." autocomplete="off">
            <button id="searchButton">
                <i class="fas fa-search"></i> Buscar
            </button>
        </div>
    </section>

    <section class="results-section">
        <div class="results-header">
            <h2 id="resultsTitle">Todas las medicinas</h2>
            <span id="resultsCount">0 encontradas</span>
        </div>
        <div id="resultsContainer" class="medicines-grid">
            <div class="empty-state">
                <p>Cargando medicinas...</p>
            </div>
        </div>
    </section>

    <footer>
        <p>API Medicinas Naturales • Proyecto de Rocio Lourdes Guimet</p>
    </footer>
</div>

<script>
    let allMedicines = [];

    // --- LÓGICA DARK MODE ---
    const toggleSwitch = document.querySelector('#checkbox');
    const modeText = document.querySelector('#modeText');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme) {
        document.documentElement.setAttribute('data-theme', currentTheme);
        if (currentTheme === 'dark') {
            toggleSwitch.checked = true;
            modeText.textContent = "Mode Dark Side Of The Moon";
        } else {
            modeText.textContent = "Shine On You Crazy Diamond";
        }
    }

    toggleSwitch.addEventListener('change', (e) => {
        if (e.target.checked) {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            modeText.textContent = "Mode Dark Side Of The Moon";
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            modeText.textContent = "Shine On You Crazy Diamond";
        }
    });

    // --- LÓGICA DE DATOS ---
    document.addEventListener('DOMContentLoaded', () => {
        loadMedicines();
        const searchInput = document.getElementById('searchInput');

        searchInput.addEventListener('input', debounce(() => {
            searchMedicines(searchInput.value);
        }, 300));

        document.getElementById('searchButton').addEventListener('click', () => {
            searchMedicines(searchInput.value);
        });
    });

    async function loadMedicines() {
        try {
            const response = await fetch('/api/medicinas');
            allMedicines = await response.json();
            displayMedicines(allMedicines);
            updateResultsTitle('Todas las medicinas', allMedicines.length);
        } catch (error) {
            console.error(error);
        }
    }

    async function searchMedicines(query) {
        if (!query.trim()) {
            displayMedicines(allMedicines);
            updateResultsTitle('Todas las medicinas', allMedicines.length);
            return;
        }
        try {
            const response = await fetch(`/api/medicinas/buscar?q=${encodeURIComponent(query)}`);
            const medicines = await response.json();
            displayMedicines(medicines);
            updateResultsTitle(`Resultados para "${query}"`, medicines.length);
        } catch (error) {
            console.error(error);
        }
    }

    function displayMedicines(medicines) {
        const container = document.getElementById('resultsContainer');
        if (medicines.length === 0) {
            container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted)"><h3>No se encontraron resultados</h3></div>`;
            return;
        }
        container.innerHTML = medicines.map(m => `
            <div class="medicine-card">
                <div class="medicine-header">
                    <h3 class="medicine-name">${escapeHtml(m.nombre)}</h3>
                    <small style="color:var(--text-muted)">ID: ${m.id}</small>
                </div>
                <div class="medicine-body">
                    <p class="medicine-desc">${escapeHtml(m.descripcion || 'Sin descripción')}</p>
                    <div style="color:#4CAF50; font-weight:500; font-size: 0.9rem;">
                        <i class="fas fa-mortar-pestle"></i> ${escapeHtml(m.modoUso || 'No especificado')}
                    </div>
                </div>
            </div>
        `).join('');
    }

    function updateResultsTitle(title, count) {
        document.getElementById('resultsTitle').textContent = title;
        document.getElementById('resultsCount').textContent = `${count} medicina(s)`;
    }

    function debounce(func, wait) {
        let timeout;
        return (...args) => {
            clearTimeout(timeout);
            timeout = setTimeout(() => func(...args), wait);
        };
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
